[project]
name = "blastradius"
version = "0.1.0"
description = "Blast radius + rollback runbook generator for Python repos"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
blastradius = "blastradius.cli:main"

[tool.setuptools.packages.find]
include = ["blastradius*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
